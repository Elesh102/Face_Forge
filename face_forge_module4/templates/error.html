{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 50px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 3rem; margin-bottom: 12px;">⚠️</div>
    <h2 style="color: #fff; margin-bottom: 8px;">Error {{ code }}</h2>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Home</a>
</div>
{% endblock %}
